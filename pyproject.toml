[project]
name = "peakfitpy"
dynamic = ["version"]  # Discovering of the version by the setuptools (see below: in the 'file' or 'attr')
authors = [
	{name = "Sergei Klykov", email = "sergej.klykow@gmail.com"}
]
description = "Fitting of set of curves on 1D data (Y=f(X)) for finding a single peak and its properties"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["1D curve fitting", "single peak properties"]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "numpy",
    "matplotlib",
	"scipy",
]
[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[project.urls]  # METADATA in a wheel file will represent the data below by using pip show peakfitpy -v
"Homepage" = "https://github.com/sklykov/peakfit"
"Repository" = "https://github.com/sklykov/peakfit"
"Bug Tracker" = "https://github.com/sklykov/peakfit/issues"
"Documentation" = "https://github.com/sklykov/peakfit"
"Changelog" = "https://github.com/sklykov/peakfit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]  # Manifest.in file is only required for adding some package-data
where = ["src"]
include = ["peakfitpy*"]
exclude = ["tests"]

[tool.setuptools.exclude-package-data]
peakfitpy = ["*.png"]  # should exclude image files from distribution

[tool.setuptools.dynamic]
version = {attr = "peakfitpy.__version__"}  # Variable set in the __init__.py

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 145  # my own preference
indent-width = 4
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]
ignore = ["E702", "E402", # used in the IDE
    "SIM108", # many ternany operator replacements in a code
    "SIM113", # potentially can break logic in a loop
]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true  # mypy will warn if any of options below not valid
warn_redundant_casts = true  # warn about unnecessary cast(): from typing import cast
warn_unused_ignores = true  # warn about unused comments '# type: ignore'
show_error_codes = true  # enables error code in a report
pretty = true  # better formatted report in a console
strict_equality = true  # checks proper usage of ==, !=, in
no_implicit_optional = true  # throws error on: def f(x: int = None): ...
# Note: flags below introduces too strict type checks
check_untyped_defs = false  # mypy checks untyped expressions and tries to infer types

# disable some checks which produce too many wrong results
disable_error_code = [
    "operator",
    "index",
]

exclude = [
    '^build/',
    '^dist/',
]

# Numerical function implementations:
# scalar / array unions create many false positive diagnostics
[[tool.mypy.overrides]]
module = ["peakfitpy.utils.fitting_funcs"]
disable_error_code = [
    "assignment",
    "arg-type",
    "var-annotated",
]

# Main fitting class:
# many values are logically defined by a program state, which mypy cannot infer
[[tool.mypy.overrides]]
module = ["peakfitpy.peakfit"]
disable_error_code = [
    "union-attr",
	"arg-type",
	"return-value",
]

[[tool.mypy.overrides]]  # for ignoring warning about not checked imported libraries
module = ["scipy.*",]
ignore_missing_imports = true
