name: Run Python tests

on:
  push:
    branches: [ main ]  # - add for limiting it to be triggered only by pushes to the main branch
    paths:  # triggers testing action if only any Python / listed files have been changed
      - 'src/peakfitpy/**'  # Package implementation
      - 'tests/test_*.py'   # Automated tests; excludes example scripts
      - 'pyproject.toml'
      - '.github/workflows/test.yaml'
  pull_request:
     branches: [ main ]
     paths:  # triggers testing action if only any Python / listed files have been changed
      - 'src/peakfitpy/**'
      - 'tests/test_*.py'
      - 'pyproject.toml'
      - '.github/workflows/test.yaml'

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code  # loads code from a repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: python -m pytest
